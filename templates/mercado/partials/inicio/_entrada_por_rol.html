<!-- 4. ENTRADA SEGMENTADA POR TIPO DE USUARIO -->
<div class="role-entry-section">
    <div class="section-tag-center">PARTICIPÁ EN LA RED FEDERAL</div>
    <h2 class="section-headline-center">¿Cuál es tu rol en la cadena productiva?</h2>
    <p class="section-subheadline-center">Elegí tu perfil para ingresar directamente a las herramientas de tu sector.</p>

    <div class="role-entry-cards">
        <button type="button" class="role-card role-buyer" onclick="cambiarVistaRol('vista-comprador')">
            <div class="role-card-top">
                <span class="role-tag">01 · COMPRADOR</span>
                <span class="role-arrow">Ingresar</span>
            </div>
            <div class="role-card-title">Productor Agropecuario</div>
            <p class="role-card-desc">
                Avícolas, feedlots, tambos y calderas. Encontrá subproductos cercanos y cotizalos puestos en tranquera con flete a mitad de precio o retiro propio.
            </p>
        </button>

        <button type="button" class="role-card role-seller" onclick="cambiarVistaRol('vista-vendedor')">
            <div class="role-card-top">
                <span class="role-tag">02 · VENDEDOR</span>
                <span class="role-arrow">Ingresar</span>
            </div>
            <div class="role-card-title">Industria Generadora</div>
            <p class="role-card-desc">
                Molinos, aserraderos, bodegas y citrícolas. Evacuá excedentes críticos y emití tu Remito Circular con Certificado Ambiental Hedera.
            </p>
        </button>

        <button type="button" class="role-card role-carrier" onclick="cambiarVistaRol('vista-logistica')">
            <div class="role-card-top">
                <span class="role-tag">03 · LOGÍSTICA</span>
                <span class="role-arrow">Ingresar</span>
            </div>
            <div class="role-card-title">Transporte y Fleteros</div>
            <p class="role-card-desc">
                Camiones con retorno vacío. Monetizá tus kilómetros de vuelta en corredores nacionales con cobro en garantía al descargar.
            </p>
        </button>
    </div>
</div>
